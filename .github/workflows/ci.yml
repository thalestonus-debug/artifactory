name: CI

on:
  push:
  pull_request:

jobs:
  validar-e-testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar estrutura e rodar testes de todas as frentes
        run: ./ferramentas/testar_tudo.sh
